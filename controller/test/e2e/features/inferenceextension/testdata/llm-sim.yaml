apiVersion: v1
kind: Namespace
metadata:
  name: benchmark
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-sim
  namespace: benchmark
spec:
  replicas: 3
  selector:
    matchLabels:
      app: llm-sim
  template:
    metadata:
      labels:
        app: llm-sim
        model: tinyllama
    spec:
      containers:
      - name: sim
        image: ghcr.io/llm-d/llm-d-inference-sim:latest
        args:
        - --model
        - TinyLlama/TinyLlama-1.1B-Chat-v1.0
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"